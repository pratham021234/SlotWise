services:
  postgres:
    image: postgres:16-alpine
    container_name: slotwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotwise}
      POSTGRES_USER: ${POSTGRES_USER:-slotwise_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotwise_secure_dev_password_2026}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - slotwise_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slotwise_app} -d ${POSTGRES_DB:-slotwise}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slotwise-network

volumes:
  slotwise_pgdata:
    name: slotwise_pgdata

networks:
  slotwise-network:
    name: slotwise-network
    driver: bridge

